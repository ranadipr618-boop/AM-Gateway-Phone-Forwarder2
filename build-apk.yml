name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk am-sms-forwarder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: am-sms-forwarder-apk
          path: am-sms-forwarder.apk
